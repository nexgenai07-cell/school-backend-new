<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NexGen Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root { --bg: #F8FAFC; --card: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
          --primary: #6366F1; --primary-soft: #EEF2FF; --danger: #EF4444; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
          box-shadow: 0 10px 30px rgba(15,23,42,.06); padding: 36px; width: 100%; max-width: 380px; }
  .logo-badge { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
                justify-content: center; background: linear-gradient(135deg, #818CF8, #6366F1); color: #fff;
                margin-bottom: 16px; }
  .logo-badge svg { width: 22px; height: 22px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: #475569; }
  .field input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
                 font-family: inherit; font-size: 13px; outline: none; transition: border .15s; }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
  .btn { width: 100%; padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13px;
         cursor: pointer; border: none; margin-top: 6px; color: #fff;
         background: linear-gradient(135deg, #818CF8, #6366F1); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
  .btn:hover { box-shadow: 0 6px 18px rgba(99,102,241,.45); }
  .error { background: #FEF2F2; color: var(--danger); border-radius: 9px; padding: 10px 12px;
           font-size: 12px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-badge"><i data-lucide="zap"></i></div>
    <h1>Sign in to your portal</h1>
    <p class="sub">Students, teachers &amp; staff — one login, your own dashboard.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
